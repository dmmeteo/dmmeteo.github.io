name: Deploy Hugo site to Pages

on:
  push:
    branches: ["master"]
    paths:
      - "site/**"
      - ".github/workflows/hugo.yml"
  # Build (but never deploy) on PRs, so a broken site is caught before merge.
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/hugo.yml"
  workflow_dispatch:

# Permissions are set per job: only `deploy` may write to Pages.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      # baseURL comes from hugo.toml, so this build is byte-identical to a local
      # one. Overriding it from CI is how a localhost canonical once shipped.
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --gc --printPathWarnings
        working-directory: ./site

      # Without this the build cannot fail: Hugo exits 0 even when it renders
      # no home page at all.
      - name: Smoke check the build output
        working-directory: ./site
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -q 'dimaforcepush' public/index.html
          grep -q '<link rel=canonical href=https://dmmeteo.dev/>' public/index.html
          ! grep -q 'livereload' public/index.html
          ! grep -q 'localhost:1313' public/index.html
          ! grep -qE 'href="#"|href=""' public/index.html
          ! grep -qE 'googletagmanager|platform\.twitter\.com|umami' public/index.html
          test -s public/sitemap.xml
          test -s public/index.xml
          test -s public/robots.txt
          test -s public/CNAME
          echo "smoke check passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
