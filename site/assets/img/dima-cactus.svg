<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 445" role="img" aria-labelledby="dfp-t">
<title id="dfp-t">Dima at a laptop, unimpressed; a dancing cactus next to him</title>
<style>
.dfp-ln{fill:none;stroke:currentColor;stroke-width:var(--dfp-stroke,6);stroke-linecap:round;stroke-linejoin:round}
.dfp-bg{fill:var(--dfp-fill,#fff)}
.dfp-ink{fill:currentColor}
.dfp-wg{stroke-width:calc(var(--dfp-stroke,6)*.85)}
.dfp-dt{stroke-width:calc(var(--dfp-stroke,6)*.62)}
.dfp-cac{stroke:var(--dfp-cactus,currentColor)}
.dfp-cf{fill:var(--dfp-cactus,currentColor)}
.dfp-cbg{fill:var(--dfp-cactus-fill,var(--dfp-fill,#fff))}
.dfp-lid{transform:scaleY(0);transform-box:fill-box;transform-origin:top;animation:dfp-blink 5.6s linear infinite}
.dfp-closed .dfp-lid{animation:none;transform:none}
#cactus-body{transform-box:fill-box;transform-origin:50% 100%;animation:dfp-sway 7s ease-in-out infinite}
.dfp-wiggles{animation:dfp-wig 7s linear infinite}
@keyframes dfp-blink{0%,97%{transform:scaleY(0)}98.3%{transform:scaleY(1)}99.6%,100%{transform:scaleY(0)}}
@keyframes dfp-sway{0%,22%,100%{transform:rotate(0)}3%{transform:rotate(-4deg)}7%{transform:rotate(4deg)}11%{transform:rotate(-4deg)}15%{transform:rotate(4deg)}19%{transform:rotate(-2deg)}}
@keyframes dfp-wig{0%,23%,100%{opacity:0}3%,19%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dfp-lid,#cactus-body,.dfp-wiggles{animation:none}}
</style>
