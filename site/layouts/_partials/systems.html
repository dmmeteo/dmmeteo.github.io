<div class="systems">
  {{- range hugo.Data.systems.items }}
  {{- $item := . }}
  <article class="system">
    <p class="mono status">{{ .status }}</p>
    <h3>{{ .name }}</h3>
    <p>{{ .blurb }}</p>
    {{- with .url }}
    <a class="link" href="{{ . }}">{{ $item.linkText | default "repository" }} &rarr;</a>
    {{- end }}
  </article>
  {{- end }}
</div>
