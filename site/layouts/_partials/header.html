<header class="top">
  <a class="brand" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>dimaforcepush</a>
  <nav class="nav" aria-label="Main">
    {{- range site.Menus.main }}
    {{- $current := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
    <a href="{{ .URL }}"{{ if $current }} aria-current="{{ cond ($.IsMenuCurrent "main" .) "page" "true" }}"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
  <span class="rev mono" aria-hidden="true">{{ site.Params.mark }}</span>
</header>
