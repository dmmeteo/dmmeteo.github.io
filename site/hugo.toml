baseURL = "https://dmmeteo.dev/"
locale = "en-us"
title = "dimaforcepush"
description = "Dmytro Sichkar — a Python engineer in Ukraine building and self-hosting agentic systems as daily infrastructure."

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Tags render as plain labels; there are no taxonomy pages to link to.

[module]
  [module.hugoVersion]
    min = "0.146.0"

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  page = ["html"]

[params]
  author = "Dmytro Sichkar"
  brand = "dimaforcepush"
  mark = "DFP / FIELD NOTES"
  principle = ["PROOF", "BEFORE", "AUTONOMY"]
  github = "https://github.com/dmmeteo"
  x = "https://x.com/dmmeteo"
  xhandle = "@dmmeteo"
  email = "dmmeteo@gmail.com"
  ogimage = "og.png"

[markup.goldmark.renderer]
  unsafe = false

[taxonomies]

# Cloudflare's Email Address Obfuscation rewrites mailto: links at the edge and
# injects a decode script, which would make the address JS-dependent. The
# documented opt-out is an HTML comment, so comments must survive minification.
[minify]
  [minify.tdewolff.html]
    keepComments = true
