baseURL = "https://dmmeteo.dev/"
locale = "en-us"
title = "dimaforcepush"
description = "Dmytro Sichkar — a Python engineer in Ukraine building and self-hosting agentic systems as daily infrastructure."

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[module]
  [module.hugoVersion]
    min = "0.146.0"

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]
  page = ["html"]

# The home feed and /log/ pages show this many entries before "load older".
[pagination]
  pagerSize = 12

[params]
  leadSince = 2021  # team lead since; whoami shows now.Year - leadSince
  description = "Dmytro Sichkar — a Python engineer in Ukraine building and self-hosting agentic systems as daily infrastructure."
  pagerSize = 12  # keep equal to pagination.pagerSize
  author = "Dmytro Sichkar"
  brand = "dimaforcepush"
  mark = "DFP · REV 02"
  github = "https://github.com/dmmeteo"
  x = "https://x.com/dmmeteo"
  xhandle = "@dmmeteo"
  ogimage = "og.png"

[menus]
  [[menus.main]]
    name = "log/"
    pageRef = "/log"
    weight = 10
  [[menus.main]]
    name = "things/"
    pageRef = "/things"
    weight = 20
  [[menus.main]]
    name = "whoami/"
    pageRef = "/whoami"
    weight = 30

# Content is authored in this repo; nested shortcodes (flow inside chapter)
# need their HTML kept when the parent renders its inner Markdown.
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
